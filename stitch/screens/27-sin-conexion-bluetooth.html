<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"><meta content="mobile_blank" name="shell-type"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"><style>@layer base{html,body{width:100vw;margin:0;padding:0;}body{overscroll-behavior:none;}.pb-safe{padding-bottom:env(safe-area-inset-bottom,0px);}.pt-safe{padding-top:env(safe-area-inset-top,0px);}main>:first-child{margin-top:0!important;}main>:last-child{margin-bottom:0!important;}}::-webkit-scrollbar{display:none;}</style><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config = { darkMode: "class", theme: { extend: { colors: { "inverse-primary": "#b4c5ff", "tertiary-fixed-dim": "#f6be21", "surface-bright": "#f7f9fe", "on-surface-variant": "#444651", "on-secondary-fixed": "#001849", "surface-container-low": "#f1f4f9", "tertiary-fixed": "#ffdf9b", "on-tertiary-fixed-variant": "#5a4300", "on-error-container": "#93000a", "primary": "#00266f", "on-secondary-fixed-variant": "#324578", "secondary": "#4a5d91", "surface-container-highest": "#dfe3e8", "on-surface": "#181c20", "outline-variant": "#c4c6d3", "surface-dim": "#d7dadf", "surface-container": "#ebeef3", "on-background": "#181c20", "on-tertiary-fixed": "#251a00", "surface": "#f7f9fe", "on-secondary": "#ffffff", "primary-fixed-dim": "#b4c5ff", "inverse-surface": "#2d3135", "secondary-fixed-dim": "#b3c5ff", "primary-fixed": "#dbe1ff", "error-container": "#ffdad6", "surface-container-high": "#e5e8ed", "on-primary-fixed-variant": "#204193", "on-primary-container": "#92acff", "on-tertiary-container": "#dba700", "background": "#f7f9fe", "on-secondary-container": "#3c4f82", "surface-container-lowest": "#ffffff", "primary-container": "#1a3d8f", "tertiary": "#3a2a00", "secondary-fixed": "#dbe1ff", "on-primary-fixed": "#00174b", "error": "#ba1a1a", "surface-variant": "#dfe3e8", "surface-tint": "#3b5aad", "outline": "#747683", "on-tertiary": "#ffffff", "on-primary": "#ffffff", "tertiary-container": "#553f00", "inverse-on-surface": "#eef1f6", "secondary-container": "#afc2fe", "on-error": "#ffffff" }, borderRadius: { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" }, spacing: { "space-lg": "1.5rem", "space-xs": "0.25rem", "space-md": "1rem", "gutter-sm": "0.75rem", "margin": "1rem", "space-xl": "2rem", "margin-tablet": "1.5rem", "space-sm": "0.5rem", "gutter": "1rem" }, fontFamily: { "body-lg": ["Inter"], "label-md": ["Inter"], "label-lg": ["Inter"], "label-sm": ["Inter"], "headline-md": ["Inter"], "title-lg": ["Inter"], "title-md": ["Inter"], "body-md": ["Inter"], "body-sm": ["Inter"], "headline-lg": ["Inter"], "display-lg": ["Inter"], "headline-sm": ["Inter"] }, fontSize: { "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }], "label-md": ["12px", { "lineHeight": "16px", "letterSpacing": "0.02em", "fontWeight": "500" }], "label-lg": ["14px", { "lineHeight": "20px", "letterSpacing": "0.01em", "fontWeight": "600" }], "label-sm": ["11px", { "lineHeight": "14px", "letterSpacing": "0.02em", "fontWeight": "500" }], "headline-md": ["24px", { "lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "600" }], "title-lg": ["18px", { "lineHeight": "24px", "fontWeight": "600" }], "title-md": ["16px", { "lineHeight": "22px", "fontWeight": "600" }], "body-md": ["14px", { "lineHeight": "20px", "fontWeight": "400" }], "body-sm": ["12px", { "lineHeight": "16px", "fontWeight": "400" }], "headline-lg": ["30px", { "lineHeight": "36px", "letterSpacing": "-0.015em", "fontWeight": "700" }], "display-lg": ["40px", { "lineHeight": "48px", "letterSpacing": "-0.02em", "fontWeight": "700" }], "headline-sm": ["20px", { "lineHeight": "26px", "letterSpacing": "-0.005em", "fontWeight": "600" }] } } } }</script></head><body class="bg-surface font-body-md text-on-surface antialiased flex flex-col min-h-screen pt-safe pb-safe"><main class="flex-1 flex flex-col relative w-full bg-surface px-margin"><div class="flex flex-col w-full">
<!-- Top Dismiss Action -->
<div class="flex justify-end items-center w-full py-space-sm">
<button aria-label="Cerrar" class="w-12 h-12 flex items-center justify-center rounded-full bg-surface-container-low text-on-surface hover:bg-surface-container transition-colors active:scale-95" type="button">
<span class="material-symbols-outlined text-[24px]">close</span>
</button>
</div>
<!-- Main Alert Visual & Guidance -->
<div class="flex flex-col items-center text-center px-space-xs mt-space-sm">
<!-- Visual Bluetooth Disabled Indicator -->
<div class="relative w-36 h-36 flex items-center justify-center rounded-full bg-surface-container-low mb-space-lg shadow-sm">
<!-- Soft Ambient Glow / Ring -->
<div class="absolute inset-0 rounded-full bg-surface-container-high/60 scale-110 -z-10 animate-pulse"></div>
<!-- Central Bluetooth Disabled Icon with Badge -->
<div class="relative flex items-center justify-center">
<span class="material-symbols-outlined text-primary text-[56px]">bluetooth_disabled</span>
<div class="absolute -bottom-1 -right-1 w-7 h-7 rounded-full bg-surface-container-lowest flex items-center justify-center shadow-md">
<span class="material-symbols-outlined text-error text-[18px]" style="font-variation-settings: 'FILL' 1;">error</span>
</div>
</div>
</div>
<!-- Title & Subtitle -->
<h1 class="font-headline-sm text-headline-sm text-primary font-bold mb-space-xs tracking-tight">
      Activa el Bluetooth
    </h1>
<p class="font-body-md text-body-md text-on-surface-variant max-w-[270px] leading-relaxed mb-space-lg">
      Lo necesitamos para confirmar que estás en el salón.
    </p>
<!-- Context Explanation Card -->
<div class="w-full bg-surface-container-low rounded-2xl p-space-md text-left flex items-start gap-space-sm mb-space-xl shadow-sm">
<div class="w-9 h-9 rounded-xl bg-surface-container-highest flex items-center justify-center shrink-0 text-primary-container">
<span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 1;">sensors</span>
</div>
<div class="flex-1">
<div class="font-label-sm text-label-sm text-secondary font-bold uppercase tracking-wider mb-0.5">
          Verificación en tiempo real
        </div>
<p class="font-body-sm text-body-sm text-on-surface-variant leading-snug">
          Asistly valida tu presencia física detectando la señal inalámbrica emitida por el docente en el <span class="font-semibold text-on-surface">Aula 101</span>.
        </p>
</div>
</div>
<!-- Micro Benefit / Campus Security Info -->

</div>
<!-- Bottom Interactive CTA Panel -->
<div class="mt-auto pt-space-md pb-space-lg flex flex-col gap-space-xs w-full">
<!-- Primary Yellow Action Button -->
<button class="w-full h-[52px] rounded-xl bg-tertiary-fixed-dim hover:bg-tertiary-fixed text-primary font-label-lg text-label-lg flex items-center justify-center gap-2 shadow-md transition-all active:scale-[0.98]" id="btn-activate-bluetooth" type="button">
<span class="material-symbols-outlined text-[22px]">bluetooth</span>
<span class="">Activar Bluetooth</span>
</button>
<!-- Secondary Cancellation Button -->
<button class="w-full h-12 rounded-xl text-secondary font-label-lg text-label-lg hover:bg-surface-container-low transition-colors active:bg-surface-container" type="button">
      Cancelar
    </button>
</div>
</div>
<script>
  (function() {
    const activateBtn = document.getElementById('btn-activate-bluetooth');
    if (activateBtn) {
      activateBtn.addEventListener('click', function() {
        const originalContent = activateBtn.innerHTML;
        activateBtn.innerHTML = `
          <svg class="animate-spin h-5 w-5 text-primary" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path>
          </svg>
          <span>Conectando...</span>
        `;
        activateBtn.disabled = true;
        setTimeout(() => {
          activateBtn.innerHTML = originalContent;
          activateBtn.disabled = false;
        }, 2000);
      });
    }
  })();
</script></main>

</body></html>
