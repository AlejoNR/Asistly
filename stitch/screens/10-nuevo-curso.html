<script>
  (() => {
    const chips = document.querySelectorAll('.day-chip');
    chips.forEach(chip => {
      chip.addEventListener('click', () => {
        const isPressed = chip.getAttribute('aria-pressed') === 'true';
        if (isPressed) {
          chip.setAttribute('aria-pressed', 'false');
          chip.classList.remove('bg-primary-container', 'text-on-primary', 'shadow-sm');
          chip.classList.add('bg-surface-container', 'text-on-surface-variant');
        } else {
          chip.setAttribute('aria-pressed', 'true');
          chip.classList.remove('bg-surface-container', 'text-on-surface-variant');
          chip.classList.add('bg-primary-container', 'text-on-primary', 'shadow-sm');
        }
      });
    });
  })();
