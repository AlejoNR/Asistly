<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"><meta content="mobile_blank" name="shell-type"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">

, "secondary": "#4a5d91", "on-primary": "#ffffff" }, borderRadius: { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" }, spacing: { "margin-tablet": "1.5rem", "space-xs": "0.25rem", "gutter": "1rem", "margin": "1rem", "space-sm": "0.5rem", "space-xl": "2rem", "gutter-sm": "0.75rem", "space-lg": "1.5rem", "space-md": "1rem" }, fontFamily: { "title-lg": ["Inter"], "headline-sm": ["Inter"], "label-sm": ["Inter"], "display-lg": ["Inter"], "title-md": ["Inter"], "body-lg": ["Inter"], "label-md": ["Inter"], "body-sm": ["Inter"], "body-md": ["Inter"], "headline-lg": ["Inter"], "headline-md": ["Inter"], "label-lg": ["Inter"] }, fontSize: { "title-lg": ["18px", { "lineHeight": "24px", "fontWeight": "600" }], "headline-sm": ["20px", { "lineHeight": "26px", "letterSpacing": "-0.005em", "fontWeight": "600" }], "label-sm": ["11px", { "lineHeight": "14px", "letterSpacing": "0.02em", "fontWeight": "500" }], "display-lg": ["40px", { "lineHeight": "48px", "letterSpacing": "-0.02em", "fontWeight": "700" }], "title-md": ["16px", { "lineHeight": "22px", "fontWeight": "600" }], "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }], "label-md": ["12px", { "lineHeight": "16px", "letterSpacing": "0.02em", "fontWeight": "500" }], "body-sm": ["12px", { "lineHeight": "16px", "fontWeight": "400" }], "body-md": ["14px", { "lineHeight": "20px", "fontWeight": "400" }], "headline-lg": ["30px", { "lineHeight": "36px", "letterSpacing": "-0.015em", "fontWeight": "700" }], "headline-md": ["24px", { "lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "600" }], "label-lg": ["14px", { "lineHeight": "20px", "letterSpacing": "0.01em", "fontWeight": "600" }] } } } }</script><style>
    body {
      min-height: max(884px, 100dvh);

  </style>
</head><body class="bg-surface font-body-md text-on-surface min-h-screen flex flex-col pt-safe pb-safe"><main class="flex flex-col relative w-full flex-1 bg-surface px-margin"><div class="flex flex-col w-full pb-safe">
<!-- Friendly Top Illustration Badge -->
<div class="flex flex-col items-center justify-center pt-space-md pb-space-sm">
<div class="relative flex items-center justify-center w-20 h-20 rounded-full bg-surface-container shadow-sm mb-space-sm">
<div class="absolute inset-0 rounded-full bg-primary-fixed opacity-40 animate-pulse"></div>
<span class="material-symbols-outlined text-primary text-[38px] relative z-10" style="font-variation-settings: 'FILL' 1;">security</span>
</div>
<!-- Title and Subtitle -->
<h1 class="font-headline-md text-headline-md text-primary text-center px-space-md mb-space-xs">
      Antes de empezar
    </h1>
<p class="font-body-md text-body-md text-on-surface-variant text-center px-space-lg max-w-sm">
      Asistly necesita estos permisos para verificar tu asistencia en el salón.
    </p>
</div>
<!-- Permissions Cards Container -->
<div class="flex flex-col gap-space-md mt-space-md mb-space-xl">
<!-- Card 1: Bluetooth -->
<div class="flex items-center justify-between p-space-md bg-surface-container rounded-[16px] shadow-sm transition-all duration-300">
<div class="flex items-center gap-space-md min-w-0 pr-space-sm">
<div class="w-12 h-12 rounded-full bg-surface-container-lowest flex items-center justify-center flex-shrink-0 shadow-sm text-primary">
<span class="material-symbols-outlined text-[24px]">bluetooth_searching</span>
</div>
<div class="flex flex-col min-w-0">
<span class="font-title-md text-title-md text-primary truncate">Bluetooth</span>
<span class="font-body-sm text-body-sm text-on-surface-variant line-clamp-2">Para recordarte tus clases antes de que empiecen</span>
</div>
</div>
<div class="flex-shrink-0">
<button aria-label="Permitir acceso a Bluetooth" class="h-10 px-space-md bg-primary text-on-primary rounded-xl font-label-md text-label-md flex items-center justify-center gap-1 active:scale-95 transition-transform" id="btn-perm-bluetooth" onclick="togglePermission('bluetooth')">
<span class="">Permitir</span>
</button>
<div aria-label="Bluetooth concedido" class="hidden h-10 w-10 bg-primary-fixed rounded-full flex items-center justify-center text-primary" id="check-perm-bluetooth">
<span class="material-symbols-outlined text-[22px]" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
</div>
</div>
<!-- Card 2: Cámara -->
<div class="flex items-center justify-between p-space-md bg-surface-container rounded-[16px] shadow-sm transition-all duration-300">
<div class="flex items-center gap-space-md min-w-0 pr-space-sm">
<div class="w-12 h-12 rounded-full bg-surface-container-lowest flex items-center justify-center flex-shrink-0 shadow-sm text-primary">
<span class="material-symbols-outlined text-[24px]">photo_camera</span>
</div>
<div class="flex flex-col min-w-0">
<span class="font-title-md text-title-md text-primary truncate">Cámara</span>
<span class="font-body-sm text-body-sm text-on-surface-variant line-clamp-2">Para recordarte tus clases antes de que empiecen</span>
</div>
</div>
<div class="flex-shrink-0">
<button aria-label="Permitir acceso a la Cámara" class="h-10 px-space-md bg-primary text-on-primary rounded-xl font-label-md text-label-md flex items-center justify-center gap-1 active:scale-95 transition-transform" id="btn-perm-camera" onclick="togglePermission('camera')">
<span class="">Permitir</span>
</button>
<div aria-label="Cámara concedida" class="hidden h-10 w-10 bg-primary-fixed rounded-full flex items-center justify-center text-primary" id="check-perm-camera">
<span class="material-symbols-outlined text-[22px]" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
</div>
</div>
<!-- Card 3: Notificaciones -->

</div>
<!-- Primary Action CTA -->
<div class="mt-auto pt-space-md">
<button class="w-full h-[52px] bg-tertiary-fixed-dim text-primary rounded-xl font-label-lg text-label-lg flex items-center justify-center gap-space-xs shadow-md active:opacity-90 active:scale-[0.99] transition-all" id="btn-continue" onclick="handleContinue()">
<span class="">Continuar</span>
<span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
</div>
</div>
<script>
  const permissionsState = {
    bluetooth: false,
    camera: false,
    notifications: false
  };

  function togglePermission(key) {
    permissionsState[key] = !permissionsState[key];
    const btn = document.getElementById(`btn-perm-${key}`);
    const check = document.getElementById(`check-perm-${key}`);

    if (permissionsState[key]) {
      btn.classList.add('hidden');
      check.classList.remove('hidden');
      check.classList.add('flex');
    } else {
      btn.classList.remove('hidden');
      check.classList.add('hidden');
      check.classList.remove('flex');
    }
  }

  function handleContinue() {
    const allGranted = Object.values(permissionsState).every(v => v);
    if (!allGranted) {
      // Gentle vibration feedback if supported
      if (window.navigator && window.navigator.vibrate) {
        window.navigator.vibrate(50);
      }
    }
  }
</script></main>

</body></html>
