d-3xl" style="height: calc(100vh - 5rem);">
<!-- Camera Viewfinder Background Layer with Image Placeholder -->
<div class="absolute inset-0 z-0 bg-inverse-surface">
<div class="w-full h-full bg-cover bg-center opacity-40" data-alt="Darkened university auditorium and lecture hall with a large digital projector screen displaying a secure authentication grid in soft ambient lighting, modern academic classroom interior with subtle blue architectural illumination" style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuAqW85mOxsY0X4OnpmH3Vj5cUgBon7C8_Vgudq54tTZTNadxwRB8tdd2ysUNa4v_LO7Xgv8wOsZojAF_PIdobT6g2GDViwcisf5QBmRjCDukCfW0ar4aOm81-ruRbHrVB23Y0dDehufMt5ULs_yaIgbpXwxT2Fuu-DSKQf2g5bImxmBZtdJtnuQjHxCeuJNng_2_TfsZ41PCBU9_dP4GxNF_jWKBPSAwV6YqQZLNpHM_WTPd3BRhfHzwA')"></div>
<div class="absolute inset-0 bg-gradient-to-b from-inverse-surface/80 via-transparent to-inverse-surface/90"></div>
</div>
<!-- Content Layer Overlay -->
<div class="relative z-10 flex flex-col justify-between h-full p-space-md text-surface-lowest">
<!-- Header Section -->
<header class="flex flex-col gap-space-sm pt-2">
<div class="flex items-center justify-between w-full">
<!-- Step Indicator Pill -->
<div class="flex items-center gap-space-xs bg-surface-container-highest/20 backdrop-blur-md px-3 py-1.5 rounded-full shadow-sm">
<span class="w-2 h-2 rounded-full bg-tertiary-fixed-dim"></span>
<span class="font-label-md text-label-md text-surface-bright tracking-wide">Paso 2 de 2</span>
</div>
<!-- Dismiss / Cancel Button -->
<button aria-label="Cerrar escáner" class="w-10 h-10 flex items-center justify-center rounded-full bg-surface-container-highest/20 backdrop-blur-md text-surface-bright active:scale-95 transition-transform" onclick="window.history.back()" type="button">
<span class="material-symbols-outlined text-[20px]">close</span>
</button>
</div>
<!-- Proximity Beacon / Classroom Signal Pill -->
<div class="self-center flex items-center gap-2 px-3.5 py-1.5 rounded-full bg-primary-container/80 backdrop-blur-md text-primary-fixed shadow-md animate-pulse">
<span class="material-symbols-outlined text-[16px] text-tertiary-fixed-dim">bluetooth_searching</span>
<span class="font-label-sm text-label-sm font-semibold tracking-tight text-surface-bright">Señal detectada · Aula 101</span>
<span class="relative flex h-2 w-2">
<span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-tertiary-fixed-dim opacity-75"></span>
<span class="relative inline-flex rounded-full h-2 w-2 bg-tertiary-fixed-dim"></span>
</span>
</div>
</header>
<!-- Central Viewfinder / Target Reticle Section -->
<main class="flex flex-col items-center justify-center my-auto w-full">
<div class="relative w-64 h-64 sm:w-72 sm:h-72 flex items-center justify-center">
<!-- Animated Corner Brackets using tertiary-fixed-dim (#f6be21 / calibrated yellow) -->
<!-- Top-Left Bracket -->
<div class="absolute top-0 left-0 w-8 h-8 rounded-tl-xl border-t-[5px] border-l-[5px] border-tertiary-fixed-dim shadow-[0_0_12px_rgba(246,190,33,0.5)]"></div>
<!-- Top-Right Bracket -->
<div class="absolute top-0 right-0 w-8 h-8 rounded-tr-xl border-t-[5px] border-r-[5px] border-tertiary-fixed-dim shadow-[0_0_12px_rgba(246,190,33,0.5)]"></div>
<!-- Bottom-Left Bracket -->
<div class="absolute bottom-0 left-0 w-8 h-8 rounded-bl-xl border-b-[5px] border-l-[5px] border-tertiary-fixed-dim shadow-[0_0_12px_rgba(246,190,33,0.5)]"></div>
<!-- Bottom-Right Bracket -->
<div class="absolute bottom-0 right-0 w-8 h-8 rounded-br-xl border-b-[5px] border-r-[5px] border-tertiary-fixed-dim shadow-[0_0_12px_rgba(246,190,33,0.5)]"></div>
<!-- Viewfinder Reticle Central Target Area -->
<div class="w-full h-full rounded-2xl overflow-hidden relative flex flex-col items-center justify-center backdrop-contrast-125">
<!-- Subtle Center Crosshair -->
<div class="w-6 h-[2px] bg-tertiary-fixed-dim/40 absolute"></div>
<div class="h-6 w-[2px] bg-tertiary-fixed-dim/40 absolute"></div>
<!-- Dynamic SVG Laser Scan Line with CSS Animation -->
<svg class="absolute inset-0 w-full h-full pointer-events-none" xmlns="http://www.w3.org/2000/svg">
<defs>
<linearGradient id="scanGradient" x1="0%" x2="100%" y1="0%" y2="0%">
<stop offset="0%" stop-color="#f6be21" stop-opacity="0"></stop>
<stop offset="50%" stop-color="#f6be21" stop-opacity="0.9"></stop>
<stop offset="100%" stop-color="#f6be21" stop-opacity="0"></stop>
</linearGradient>
</defs>
<g class="animate-[scan_2.8s_ease-in-out_infinite]">
<line stroke="url(#scanGradient)" stroke-width="3" x1="0" x2="100%" y1="0" y2="0"></line>
<rect fill="url(#scanGradient)" height="16" opacity="0.12" width="100%" x="0" y="0"></rect>
</g>
</svg>
</div>
</div>
<!-- Human Guidance Context Messages -->
<div class="flex flex-col items-center text-center mt-6 px-4 gap-1.5 max-w-xs">
<h2 class="font-title-md text-title-md text-surface-bright drop-shadow-md">
          Apunta al código QR que proyecta tu docente
        </h2>
<div class="flex items-center gap-1.5 text-surface-container-highest/80">
<span class="material-symbols-outlined text-[15px] text-tertiary-fixed-dim animate-spin" style="animation-duration: 6s;">timelapse</span>
<p class="font-body-sm text-body-sm text-surface-container-high drop-shadow-sm">
            El código cambia cada <span class="font-semibold text-tertiary-fixed-dim">15 segundos</span>
</p>
</div>
</div>
</main>
<!-- Bottom Controls & Course Metadata Section -->
<footer class="flex flex-col items-center gap-4 w-full">
<!-- Course Identifier Card -->
<div class="flex items-center gap-2.5 px-4 py-2.5 rounded-2xl bg-surface-container-lowest/10 backdrop-blur-md text-surface-bright shadow-lg max-w-sm w-full justify-center">
<span class="material-symbols-outlined text-tertiary-fixed-dim text-[20px]">school</span>
<div class="flex flex-col items-start truncate">
<span class="font-label-lg text-label-lg font-semibold truncate leading-tight">Programación Móvil</span>
<span class="font-label-sm text-label-sm text-surface-container-highest truncate">Prof. Ramírez · Grupo 2</span>
</div>
</div>
<!-- Interactive Flashlight / Torch Action -->
<div class="flex items-center justify-center w-full pb-2">
<button class="group flex flex-col items-center gap-1.5 text-surface-bright focus:outline-none" id="torchBtn" onclick="toggleTorch()" type="button">
<div class="w-14 h-14 rounded-full bg-surface-container-highest/20 backdrop-blur-md flex items-center justify-center transition-all duration-200 shadow-md group-active:scale-90" id="torchIconBg">
<span class="material-symbols-outlined text-[26px] text-surface-bright transition-colors" id="torchIcon">flashlight_on</span>
</div>
<span class="font-label-md text-label-md text-surface-container-high tracking-wide" id="torchLabel">Linterna</span>
</button>
</div>
</footer>
</div>
</div>
<script>
  let isTorchActive = false;
  function toggleTorch() {
    isTorchActive = !isTorchActive;
    const iconBg = document.getElementById('torchIconBg');
    const icon = document.getElementById('torchIcon');
    const label = document.getElementById('torchLabel');
    
    if (isTorchActive) {
      iconBg.classList.remove('bg-surface-container-highest/20');
      iconBg.classList.add('bg-tertiary-fixed-dim', 'shadow-[0_0_16px_rgba(246,190,33,0.7)]');
      icon.classList.remove('text-surface-bright');
      icon.classList.add('text-on-tertiary-fixed');
      label.classList.add('text-tertiary-fixed-dim', 'font-semibold');
    } else {
      iconBg.classList.add('bg-surface-container-highest/20');
      iconBg.classList.remove('bg-tertiary-fixed-dim', 'shadow-[0_0_16px_rgba(246,190,33,0.7)]');
      icon.classList.add('text-surface-bright');
      icon.classList.remove('text-on-tertiary-fixed');
      label.classList.remove('text-tertiary-fixed-dim', 'font-semibold');
    }
  }
</script></main>

</body></html>
